log:
    stdout: true
    level: ${LOG_LEVEL}

persistence:
    numHistoryShards: 4
    defaultStore: default
    visibilityStore: visibility
    datastores:
        default:
            sql:
                pluginName: ${DB}
                databaseName: ${DBNAME}
                connectAddr: ${POSTGRES_SEEDS}
                connectProtocol: "tcp"
                user: ${POSTGRES_USER}
                password: ${POSTGRES_PWD}
                maxConns: 20
                maxIdleConns: 20
                maxConnLifetime: 1h
                tls:
                    enabled: ${POSTGRES_TLS_ENABLED}
                    caFile: ${POSTGRES_TLS_CA_FILE}
                    certFile:
                    keyFile:
                    enableHostVerification: ${SQL_HOST_VERIFICATION}
                    serverName:
        visibility:
            sql:
                pluginName: ${DB}
                databaseName: ${VISIBILITY_DBNAME}
                connectAddr: ${POSTGRES_SEEDS}
                connectProtocol: "tcp"
                user: ${POSTGRES_USER}
                password: ${POSTGRES_PWD}
                maxConns: 10
                maxIdleConns: 10
                maxConnLifetime: 1h
                tls:
                    enabled: ${POSTGRES_TLS_ENABLED}
                    caFile: ${POSTGRES_TLS_CA_FILE}
                    certFile:
                    keyFile:
                    enableHostVerification: ${SQL_HOST_VERIFICATION}
                    serverName:

global:
    membership:
        maxJoinDuration: 30s
        broadcastAddress: ${TEMPORAL_BROADCAST_ADDRESS}
    pprof:
        port: 0
    tls:
        refreshInterval: 0s
        expirationChecks:
            warningWindow: 0s
            errorWindow: 0s
            checkInterval: 0s
        internode:
            # This server section configures the TLS certificate that internal temporal
            # cluster nodes (history, matching, and internal-frontend) present to other
            # clients within the Temporal Cluster.
            server:
                requireClientAuth: false

                certFile: 
                keyFile: 

                certData: 
                keyData: 

            # This client section is used to configure the TLS clients within
            # the Temporal Cluster that connect to an Internode (history, matching, or
            # internal-frontend)
            client:
                serverName: 
                disableHostVerification: false
        frontend:
            server:
                requireClientAuth: ${TEMPORAL_FRONTEND_REQUIRE_CLIENT_AUTH}
                certFile: ${TEMPORAL_FRONTEND_CERT_FILE}
                keyFile: ${TEMPORAL_FRONTEND_KEY_FILE}

                certData: ${TEMPORAL_FRONTEND_CERT_DATA}
                keyData: ${TEMPORAL_FRONTEND_KEY_DATA}

            client:
                rootCaFiles: ${TEMPORAL_FRONTEND_CLIENT_ROOT_CA_FILES}
                rootCaData: ${TEMPORAL_FRONTEND_CLIENT_ROOT_CA_DATA}
                serverName: ${TEMPORAL_FRONTEND_CLIENT_SERVER_NAME}
                disableHostVerification: ${TEMPORAL_FRONTEND_CLIENT_DISABLE_HOST_VERIFICATION}
    authorization:
        jwtKeyProvider:
            keySourceURIs:
            refreshInterval: 1m
        permissionsClaimName: permissions
        permissionsRegex:
        authorizer: 
        claimMapper: 
services:
    frontend:
        rpc:
            grpcPort: 7233
            membershipPort: 6933
            bindOnIP: "0.0.0.0"
            httpPort: 7243

    matching:
        rpc:
            grpcPort: 7235
            membershipPort: 6935
            bindOnIP: "0.0.0.0"

    history:
        rpc:
            grpcPort: 7234
            membershipPort: 6934
            bindOnIP: "0.0.0.0"

    worker:
        rpc:
            grpcPort: 7239
            membershipPort: 6939
            bindOnIP: "0.0.0.0"

clusterMetadata:
    enableGlobalNamespace: false
    failoverVersionIncrement: 10
    masterClusterName: "active"
    currentClusterName: "active"
    clusterInformation:
        active:
            enabled: true
            initialFailoverVersion: 1
            rpcName: "frontend"
            rpcAddress: 127.0.0.1:7233
            httpAddress: 127.0.0.1:7243

dcRedirectionPolicy:
    policy: "noop"

# Providers coexist; the namespace's archival URI scheme selects one, and each is
# built lazily on first use. The endpoint line is dropped at startup when
# ARCHIVAL_S3_ENDPOINT is unset — empty is not the same as absent for that key.
archival:
  history:
    state: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"
      s3store:
        region: ${ARCHIVAL_S3_REGION}
        endpoint: ${ARCHIVAL_S3_ENDPOINT}
        s3ForcePathStyle: ${ARCHIVAL_S3_FORCE_PATH_STYLE}
        logLevel: 0
  visibility:
    state: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"
      s3store:
        region: ${ARCHIVAL_S3_REGION}
        endpoint: ${ARCHIVAL_S3_ENDPOINT}
        s3ForcePathStyle: ${ARCHIVAL_S3_FORCE_PATH_STYLE}
        logLevel: 0

namespaceDefaults:
  archival:
    history:
      state: "disabled"
      URI: "file:///tmp/temporal_archival/development"
    visibility:
      state: "disabled"
      URI: "file:///tmp/temporal_vis_archival/development"


dynamicConfigClient:
    filepath: "${DYNAMIC_CONFIG_FILE_PATH}"
    pollInterval: "60s"
