[project]
name = "ciso360ai-bbot"
version = "0.0.0"
description = "CISO360AI BBOT worker image — runtime Python dependencies"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi",
    "httpx[http2]",
    "psutil",
    "python-dotenv",
    "surrealdb==2.0.0",
    "temporalio",
    "uvicorn",

    # bbot — pinned to concrete commit in dev until 3.0
    # URL declared under [tool.uv.sources] for reproducibility.
    "bbot",

    # Security floors for shared transitive deps (parents allow older
    # vulnerable versions).
    "starlette>=1.4.1",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "dnspython>=2.8.0",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "pyyaml>=6.0.3,<7.0",
    "h2>=4.4.1",
    "idna>=3.15",
    "ansible-core>=2.21.1",
]

[tool.uv]
package = false
# Supply-chain cooldown: ignore releases published in the last 3 days.
exclude-newer = "3 days"

[tool.uv.sources]
bbot = { git = "https://github.com/ciso360ai/bbot", rev = "eabac72a46fa50897ef3f3dc5a19ad57f029c33f" }
