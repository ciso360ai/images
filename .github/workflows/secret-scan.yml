name: Secret Scan

# gitleaks over committed content. Mirrors the platform monorepo and docs site: the
# binary is pinned and SHA256-verified, and the scan is BLOCKING — gitleaks exits
# non-zero on any finding, and with no baseline to suppress, that only happens on a
# genuinely new secret. History was clean at 127 commits when this was added.
#
# Fork-PR safety: `pull_request` only (never `pull_request_target`), read-only token,
# no `secrets.*` referenced anywhere — which is also what lets it run on Dependabot
# pull requests, unlike `docker-publish.yml`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly catch for newly-disclosed patterns
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for `gitleaks git`

      - name: Install gitleaks (pinned + SHA256-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" -o "$tarball"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (FAILS on a finding)
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path results.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: results.sarif
          retention-days: 7
