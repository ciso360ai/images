name: Dependency Audit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Weekly catch for newly disclosed CVEs against unchanged lockfiles
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (${{ matrix.image }})
    runs-on: ubuntu-latest
    # 10 not 5: a cold bbot sync clones the pinned git source and may build from source.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [bbot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "${{ matrix.image }}/uv.lock"

      - name: Install Python (from .python-version)
        run: uv python install
        working-directory: ${{ matrix.image }}

      # Install smoke test. Export only rewrites the lock as text, and nothing
      # builds the images on a PR, so a missing wheel, a source-build failure or
      # a dead git rev would surface at the tag build. Runner platform only;
      # images publish arm64 as well.
      - name: Install from the lockfile
        run: uv sync --frozen --no-install-project
        working-directory: ${{ matrix.image }}

      - name: Export resolved deps from uv.lock
        run: |
          uv export \
            --frozen \
            --no-emit-project \
            --no-hashes \
            -o /tmp/${{ matrix.image }}-requirements.txt
        working-directory: ${{ matrix.image }}

      - name: Audit with pip-audit
        # Strict mode fails on any vulnerability. Prefer bumping the package;
        # only as a last resort add `--ignore-vuln GHSA-xxxx-xxxx-xxxx` with a
        # written rationale, and remove it once the reason no longer holds.
        #
        # GHSA-45c3-73f7-pv4m (dnspython <2.9.0, CPU use parsing DNS answers):
        # bbot 3.0.x caps dnspython <2.9.0, and its module installer re-applies
        # that cap in the image even when the lock overrides it. bbot 3.1.0
        # drops dnspython; remove this ignore with that bump.
        run: |
          uvx pip-audit \
            --strict \
            --ignore-vuln GHSA-45c3-73f7-pv4m \
            --requirement /tmp/${{ matrix.image }}-requirements.txt
